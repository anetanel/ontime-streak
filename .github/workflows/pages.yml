name: Deploy to GitHub Pages

run-name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.v.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "app=$(grep -oP 'APP_VERSION = "\K[0-9]+' js/version.js)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy v${{ needs.version.outputs.app }}
    needs: version
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
